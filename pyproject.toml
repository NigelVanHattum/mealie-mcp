[project]
name = "mealie-mcp"
version = "1.0.0"
description = "MCP server for the Mealie API — recipe storage from cookbooks, Docker-hosted SSE transport"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.1",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
include = ["server.py", "client.py", "tools/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
